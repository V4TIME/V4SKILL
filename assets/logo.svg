<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="hexGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#8957e5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- Hexagon -->
  <polygon points="100,20 175,100 100,180 25,100"
           fill="none" stroke="url(#hexGrad)" stroke-width="5" filter="url(#glow)"/>
  <polygon points="100,42 150,100 100,158 50,100"
           fill="url(#hexGrad)" opacity="0.12"/>

  <!-- V letter -->
  <text x="100" y="125" text-anchor="middle" fill="#58a6ff"
        font-family="monospace" font-size="72" font-weight="bold" filter="url(#glow)">V</text>

  <!-- Small accent dots -->
  <circle cx="165" cy="55" r="4" fill="#8957e5" opacity="0.5"/>
  <circle cx="170" cy="145" r="3" fill="#58a6ff" opacity="0.4"/>
  <circle cx="35" cy="55" r="3" fill="#f0f6fc" opacity="0.2"/>
</svg>
