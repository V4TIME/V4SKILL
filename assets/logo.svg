<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="hexGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#8957e5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="50,12 88,50 50,88 12,50"
           fill="none" stroke="url(#hexGrad)" stroke-width="3.5" filter="url(#glow)"/>
  <polygon points="50,26 74,50 50,74 26,50"
           fill="url(#hexGrad)" opacity="0.15"/>
  <text x="50" y="62" text-anchor="middle" fill="#58a6ff"
        font-family="monospace" font-size="36" font-weight="bold" filter="url(#glow)">V</text>
</svg>
